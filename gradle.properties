# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
systemProp.file.encoding=utf-8

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)

mapping_channel=official
mapping_version=1.20.1

mod_id=astralsorcery
# mod_name also drives base.archivesName, keep it filename-safe. The human readable name
# ("Astral Sorcery") is declared as displayName in META-INF/mods.toml, like in 1.16.5.
mod_name=AstralSorcery
mod_license=All rights reserved
mod_version=1.20.1-1.14.2
mod_group_id=hellfirepvp.astralsorcery
mod_authors=HellFirePvP, wiiv, VulpTheHorseDog
mod_description=Magic mod that draws power from stars and their constellations

# Integrations. JEI ships as a runtime dep of the dev run; KubeJS is compileOnly unless -PwithKubeJS=true.
jei_version=15.62.0.216
kubejs_version=2001.6.5-build.26
architectury_version=9.1.12
rhino_version=2001.2.3-build.10
