# Astral Sorcery access transformer, 1.20.1 port.
# NOTE: every comment line must have text after the '#'. Forge's AT parser splits each line on
# "#", and Java's String#split drops trailing empty strings, so a bare "#" line yields a
# zero-length array and is rejected with "Invalid access transformer line: #".
# Every entry below is the 1.20.1 equivalent of a line in the 1.16.5
# src/main/resources/META-INF/accesstransformer.cfg (same order), translated with
# de/oceanlabs/mcp/mcp_config/1.20.1-20230612.114412/srg_to_official_1.20.1.tsrg.
# The trailing comment is the official (Mojang) name of the SRG member.
# Declared by build.gradle (minecraft { accessTransformer = ... }) and META-INF/mods.toml
# ([[accessTransformers]]).

